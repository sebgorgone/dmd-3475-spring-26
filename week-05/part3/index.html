    <div id='grade-calc'>

      <label for="numGrade"></label>

      id='console'

    <script>

    var calcGradeButton = document.querySelector('#calcGradeButton').addEventListener('click', () => {
      var numberGrade = parseInt(document.querySelector('#numGrade').value);

      log('Your letter grade is ' + calcLetterGrade(numberGrade))
    })


    function calcLetterGrade(numberGrade) {
      log(typeof numberGrade + '---' + numberGrade)
      var letterGrade = 'A';

      if (numberGrade < 93 && numberGrade >= 90) {
        letterGrade = 'A-';
        return letterGrade;
      }else if (numberGrade < 90 && numberGrade >= 87) {
        letterGrade = 'B+';
        return letterGrade;
      } else if (numberGrade < 87 && numberGrade >= 83) {
        letterGrade = 'B';
        return letterGrade;
      } else if (numberGrade < 83 && numberGrade >= 80) {
        letterGrade = 'B-';
        return letterGrade;
      } else if (numberGrade < 80 && numberGrade >= 77) {
        letterGrade = 'C+';
        return letterGrade;
      } else if (numberGrade < 77 && numberGrade >= 73) {
        letterGrade = 'C';
        return letterGrade;
      } else if (numberGrade < 73 && numberGrade >= 70) {
        letterGrade = 'C-';
        return letterGrade;
      } else if (numberGrade < 70 && numberGrade >= 67) {
        letterGrade = 'D+';
        return letterGrade;
      } else if (numberGrade < 67 && numberGrade >= 63) {
        letterGrade = 'D';
        return letterGrade;
      } else if (numberGrade < 63 && numberGrade >= 60) {
        letterGrade = 'D-';
        return letterGrade;
      } else if (numberGrade < 60) {
        letterGrade = 'F';
        return letterGrade;
      }

      return letterGrade;

    }

    function log(value) {
        myConsole.innerHTML += "<p>" + value + "</p>";
      }



    </script>
