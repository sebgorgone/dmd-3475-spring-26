<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Dog Breed Browser</title>
  <style>
    .display-none {
      display: none;
    }
  </style>
</head>
<body>
   

    <h1>learning fetch</h1>
    <button
      id='prev'
    >prev</button>

    <button
      id='next'
    >next</button>
    <h2 id='page-number'>page 0</h2>

    <ul
      id='browser-list'
    >
      
    </ul>

    <script>

    let dogData;
    let pageNum = 0;

    const browserList = document.querySelector('#browser-list');
    const numDisplay = document.querySelector('#page-number');


    const prevButton = document.querySelector('#prev');
    const nextButton = document.querySelector('#next');


    nextButton.addEventListener('click', () => {pageNum++; renderIndex()});
    prevButton.addEventListener('click', () => {pageNum--; renderIndex()});



    const pageLimit = 20;

    const dogFetch = () => fetch('https://dogapi.dog/api/v2/breeds').then(response => response.json()).then(data => {
      dogData = data.data;
      console.log(dogData);
      renderIndex(0)
  
    })

    dogFetch();

    function renderIndex() {
      const length = dogData.length;
      browserList.innerHTML = '';
      numDisplay.innerText = `Page ${pageNum}`

      function getEndIndex () {
        if ( (pageNum * pageLimit + pageLimit) > length - 1 ){
          return length;
        }else {
          return (pageNum * pageLimit + pageLimit)
        }
      }

      if (pageNum * pageLimit === 0) {
        prevButton.classList.add('display-none');
      } else {
        prevButton.classList.remove('display-none');
      }

      if (pageNum * pageLimit + pageLimit < length) {
        nextButton.classList.remove('display-none');
      }else {
        nextButton.classList.add('display-none');
      }

      for (let i = pageNum * pageLimit; i < getEndIndex(); i++) {
        const li = document.createElement('li');
        const name = document.createElement('h3');
        const a = document.createElement('a');

        name.innerText = dogData[i].attributes.name;
        a.innerText = 'Show Info';
        a.href=`./profile.html?id=${dogData[i].id}`;


        li.appendChild(name);
        li.appendChild(a);

        li.style = 'background-color: grey; padding: 4px; margin: 12px; border-radius: 4px;'

        browserList.appendChild(li)
      }



    }

    </script>

</body>
</html>
