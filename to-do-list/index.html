<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMD todo list</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header>


      <h1>TO DO...</h1>

      <input 
        type="text"
        placeholder="new task..."
        id='task-input'
      >




      <div>
        <input 
          type='text'
          placeholder='notes'
          id='task-note-input'
        >

        <button
          id='add-task-button'
        >ADD TASK</button>
      </div>


    </header>

    <nav>


      <button
        id='download-list-button'
      >
        download list 
      </button>

      <button
        id='upload-list-button'
      >
        upload from save
      </button>

      <button
        id='delete-list-button'
      >
        DELETE LIST
      </button>

    </nav>

    <aside>

      <button
        id='sort-by-date-button'
      >sort by date</button>

      <button
        id='sort-alphabetically-button'
      >sort a => z</button>


      <button
        id='delete-all-button'
      >DELETE ALL ITEMS</button>

    </aside>

    <main>

    </main>


    <script type='module' src='main.js'></script>
  </body>
</html>
