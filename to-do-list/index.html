<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>DMD todo list</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>


      <h1>TO DO...</h1>

      <input 
        type="text"
        placeholder="new task..."
        id='task-input'
      >

      <button
        id='add-task-button'
      >ADD TASK</button>


    </header>

    <nav>

      
      <button
        id='download-list-button'
      >
        download to-dos
      </button>

      <button
        id='upload-list-button'
      >
        upload from save
      </button>

    </nav>

    <aside>

      <button
        id='delete-all-button'
      >DELETE ALL</button>

      <button
        id='sort-by-date-button'
      >sort by date</button>

      <button
        id='sort-alphabetically-button'
      >sort alphabetically</button>

    </aside>

    <main>
      
    </main>
   

    <script type='module' src='main.js'></script>
</body>
</html>
