<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMD todo list</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <input style='display: hidden;' type="file" id="fileInput" accept=".json" />

    <header>


      <h1 id='file-title'>TO DO...</h1>

      <input 
        type="text"
        placeholder="new task..."
        id='task-input'
      >

      <input 
        type='text'
        placeholder='notes'
        id='task-note-input'
      >




      <div>

        <input 
          type='date'
          id='task-date-input'
        >

        <button
          id='add-task-button'
        >ADD TASK</button>

      </div>


    </header>


    <div
      id='search-div'
    >

      <input
        type="text"
        id="task-search-input"
        placeholder='search...'
      >
    </div>

    <div id="file-browser-div">
      
      <button id='new-task-list-button'>NEW LIST</button>

      <h2>Task lists</h2>

      <div
        id='file-browser-list'
      >
        hello
      </div>
      
    </div>


    <nav>


      <button
        id='download-list-button'
      >
        download list 
      </button>

      <button
        id='upload-list-button'
      >
        upload list
      </button>

      <button
        id='delete-list-button'
      >
        DELETE LIST
      </button>

    </nav>

    <aside>

      <button
        id='sort-by-date-button'
      >sort by date</button>

      <button
        id='sort-alphabetically-button'
      >sort a => z</button>


      <button
        id='delete-all-button'
      >DELETE ALL ITEMS</button>

    </aside>

    <ul
      id='task-list'
    >
      
    </ul>

    </ul>


    <script type='module' src='main.js'></script>
  </body>
</html>
