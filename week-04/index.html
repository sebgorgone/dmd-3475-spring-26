    var numberGrade = prompt('enter a number grade');
    var numberGrade = parseInt(numberGrade); //have converted this input into a number


    console.log('isNan check: ' + isNaN(numberGrade));
    var sum = (parseInt(numberGrade + 1));

    if (isNan(numberGrade)) {
      numberGrade = prompt('Thats not a number, try again');
    } else {

      var letterGrade = 'A';

      if (numberGrade >= 80 && numberGrade < 90) {
        letterGrade = 'B'
      }
      if (numberGrade >= 70 && numberGrade < 80) {
        letterGrade = 'C'
      }
      if (numberGrade >= 70 && numberGrade < 60) {

      }

      }
